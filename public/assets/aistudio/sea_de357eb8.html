<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Море и небо</title>
<style>
html,body{margin:0;height:100%;background:#06101c;overflow:hidden;font:14px/1.35 system-ui,sans-serif;color:#eaf0f7;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(#37506e,#0e2236);font-size:16px}
#tg{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,14,26,.55);color:#fff;font-size:20px;backdrop-filter:blur(8px);z-index:3}
#ui{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:430px;margin:auto;background:rgba(8,14,26,.74);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;z-index:2;max-height:72vh;overflow:auto;display:none;touch-action:pan-y}
#ui.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button.ch,select,input[type=text]{background:rgba(255,255,255,.1);color:inherit;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font:inherit}
button.ch:active{background:#3d6fd1}button.ch.on{background:#2f6fe0;border-color:#2f6fe0}
button.big{font-weight:600;padding:8px 16px}
label{display:flex;align-items:center;gap:8px;margin:5px 0}label span{width:78px;flex:none;opacity:.8}

#fps{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));font:11px monospace;opacity:.6;display:none;z-index:3}

<canvas id="c"></canvas><div id="msg"></div><div id="fps"></div>
<button id="tg" aria-label="Настройки">⚙</button>
<div id="ui">
<div class="row"><button class="ch big" id="auto">⟳ Авто: погода и время</button><button class="ch" id="gyro">Гироскоп</button><button class="ch" id="callship">⛵ Корабль</button></div>
<div id="src"></div>
<div class="row" id="pw"></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),D=Math.PI/180;
function solar(h,lat,doy){const dec=23.44*D*Math.sin(2*Math.PI*(doy-81)/365),ha=(h-12)*15*D,la=lat*D,
 sinEl=Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha);
 return{el:Math.asin(clamp(sinEl,-1,1)),az:Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(dec)*Math.cos(la))}}
function camVec(el,az,camAz){const a=az-camAz;return[Math.sin(a)*Math.cos(el),Math.sin(el),Math.cos(a)*Math.cos(el)]}
function rsi(o,d,r){const b=o[0]*d[0]+o[1]*d[1]+o[2]*d[2],c=o[0]*o[0]+o[1]*o[1]+o[2]*o[2]-r*r,q=b*b-c;if(q<0)return[1e5,-1e5];const e=Math.sqrt(q);return[-b-e,-b+e]}
const RE=6371e3,RA=6471e3,HR=8e3,HM=1.2e3,BR=[5.8e-6,13.5e-6,33.1e-6],BM=21e-6;
function atmos(rd,sd){const ro=[0,RE+1.5,0],pa=rsi(ro,rd,RA),pg=rsi(ro,rd,RE);let tmax=pa[1];if(pg[0]>0)tmax=Math.min(tmax,pg[0]);
 const ds=tmax/10,mu=rd[0]*sd[0]+rd[1]*sd[1]+rd[2]*sd[2],g=.76,phR=3/(16*Math.PI)*(1+mu*mu),
 phM=3/(8*Math.PI)*((1-g*g)*(1+mu*mu))/((2+g*g)*Math.pow(1+g*g-2*g*mu,1.5));
 let sR=[0,0,0],sM=[0,0,0],oR=0,oM=0,t=0;
 for(let i=0;i<10;i++){const p=[0,1,2].map(k=>ro[k]+rd[k]*(t+ds/2)),h=Math.hypot(p[0],p[1],p[2])-RE,hr=Math.exp(-h/HR)*ds,hm=Math.exp(-h/HM)*ds;oR+=hr;oM+=hm;
  const pl=rsi(p,sd,RA),dl=pl[1]/5;let lR=0,lM=0,ok=true;
  for(let j=0;j<5;j++){const q=[0,1,2].map(k=>p[k]+sd[k]*dl*(j+.5)),hq=Math.hypot(q[0],q[1],q[2])-RE;if(hq<0){ok=false;break}lR+=Math.exp(-hq/HR)*dl;lM+=Math.exp(-hq/HM)*dl}
  if(ok)for(let k=0;k<3;k++){const at=Math.exp(-(BR[k]*(oR+lR)+BM*1.1*(oM+lM)));sR[k]+=at*hr;sM[k]+=at*hm}
  t+=ds}
 return[0,1,2].map(k=>14*(sR[k]*BR[k]*phR+sM[k]*BM*phM))}
function trans(sd){if(sd[1]<-.12)return[0,0,0];const ro=[0,RE+1.5,0],pl=rsi(ro,sd,RA),dl=pl[1]/8;let oR=0,oM=0;
 for(let j=0;j<8;j++){const q=[0,1,2].map(k=>ro[k]+sd[k]*dl*(j+.5)),hq=Math.max(Math.hypot(q[0],q[1],q[2])-RE,0);oR+=Math.exp(-hq/HR)*dl;oM+=Math.exp(-hq/HM)*dl}
 return BR.map(b=>Math.exp(-(b*oR+BM*1.1*oM)))}
const LW=64,LH=32;
function bakeRow(sd,ex,out,j){const dayW=clamp(sd[1]*3,0,1),v=(j+.5)/LH,el=v*v*Math.PI/2;for(let i=0;i<LW;i++){const az=((i+.5)/LW-.5)*3.2,
  ec=el<.035?.035+el*.35:el,rd=[Math.sin(az)*Math.cos(ec),Math.sin(ec),Math.cos(az)*Math.cos(ec)],c=atmos(rd,sd),o=(j*LW+i)*4;
  {const lum=c[0]*.3+c[1]*.59+c[2]*.11,w=.8*Math.exp(-el*3.5)*dayW;for(let k=0;k<3;k++)c[k]=c[k]*(1-w)+lum*(k==2?1.08:1)*w}
  for(let k=0;k<3;k++){const nb=[.00015,.00025,.0006][k];out[o+k]=255*clamp(Math.sqrt(Math.max(0,(c[k]+nb)*ex)/4),0,1)}out[o+3]=255}}
function bakeLUT(sd,ex,out){for(let j=0;j<LH;j++)bakeRow(sd,ex,out,j)}
function moonPhase(now){return(((now/864e5+2440587.5-2451550.1)/29.530588853)%1+1)%1}
// S: {t,lat,lon,doy,cam(компас°),wind,cloud,rain,fog,storm,windDir(°)}
function frameParams(S,now){const camE=S.camEff!==undefined?S.camEff:S.cam,camAz=(camE-180)*D,sp=solar(S.t,S.lat,S.doy),sun=camVec(sp.el,sp.az,camAz),elDeg=sp.el/D;
 const ex=.9*Math.pow(10,clamp(-elDeg,0,10)*.2),tr=trans(sun),over=clamp(S.cloud*.8+S.rain*.2+S.fog*.2,0,1);
 const ph=moonPhase(now),ha=(S.t-12)*15*D-ph*2*Math.PI,la=S.lat*D,dm=5*D,sE=Math.sin(la)*Math.sin(dm)+Math.cos(la)*Math.cos(dm)*Math.cos(ha),mEl=Math.asin(clamp(sE,-1,1)),
 mAz=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(dm)*Math.cos(la)),moon=camVec(mEl,mAz,camAz),pole=camVec(la,Math.PI,camAz);
 const sunL=tr.map(v=>v*3.2*ex*(1-.88*over)),sunD=tr.map(v=>v*60*ex),night=clamp((-elDeg-3)/12,0,1);
 const bow=clamp((S.rain-.03)*12,0,1)*(1-clamp((S.rain-.45)*5,0,1))*clamp((elDeg-2)/4,0,1)*(1-clamp((elDeg-30)/12,0,1))*(1-clamp((S.cloud-.6)*3,0,1))*(S.bowOn?1:1);
 const lh=(((268-camE+540)%360)-180)*D,ship=S.shipRel!==undefined?S.shipRel:((((now/1000*.25)%360)-camE+540)%360-180)*D;
 return{bow,lh,ship,night2:clamp((-elDeg-1)/6,0,1),obj:[S.lhOn?1:0,S.shipOn?1:0,S.birdsOn?1:0],bolt:S.bolt||0,sun,sunL,sunD,moon,moonPh:ph,moonL:ex*.012*(.2+.8*night),exp:ex,pole,starRot:(S.t*15+S.doy*.9856)*D,star:night*(1-clamp(S.cloud*1.3,0,1)),elDeg,over,
  wdir:(90-(S.windDir-camE))*D,cloud:S.cloud,wind:S.wind,rain:S.rain,fog:S.fog,flash:S.flash||0}}
function skyAmbient(lut){const o=((LH-1)*LW+LW/2)*4,c=[0,1,2].map(k=>{const x=lut[o+k]/255;return x*x*4});return c}

// тайловая карта нормалей для мелкой ряби: RG — нормаль, B и A — шум (пена); 256×256
function makeNrm(){const n=256,h=new Float32Array(n*n);let s=5;const rs=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 for(let q=0;q<5;q++){const g=4<<q,gr=new Float32Array(g*g);for(let i=0;i<gr.length;i++)gr[i]=rs();const am=Math.pow(.55,q);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const fx=x/n*g,fy=y/n*g,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty),x1=(ix+1)%g,y1=(iy+1)%g,
   a=gr[iy*g+ix],b=gr[iy*g+x1],cc=gr[y1*g+ix],d=gr[y1*g+x1];h[y*n+x]+=am*(a+(b-a)*sx+(cc-a)*sy+(a-b-cc+d)*sx*sy)}}
 let mn=1e9,mx=-1e9;for(const v of h){mn=Math.min(mn,v);mx=Math.max(mx,v)}for(let i=0;i<h.length;i++)h[i]=(h[i]-mn)/(mx-mn);
 const gx=new Float32Array(n*n),gy=new Float32Array(n*n);let m=1e-6;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x;gx[i]=h[y*n+((x+1)&255)]-h[y*n+((x+255)&255)];gy[i]=h[((y+1)&255)*n+x]-h[((y+255)&255)*n+x];m=Math.max(m,Math.abs(gx[i]),Math.abs(gy[i]))}
 const out=new Uint8Array(n*n*4);for(let i=0;i<n*n;i++){out[i*4]=128+127*clamp(gx[i]/(m*.5),-1,1);out[i*4+1]=128+127*clamp(gy[i]/(m*.5),-1,1);out[i*4+2]=h[i]*255;out[i*4+3]=h[((((i>>8)+97)&255)<<8)|(((i&255)+31)&255)]*255}
 return out}

const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes,uTilt;
uniform float uTime,uCloud,uWind,uRain,uFog,uFlash,uMoonPh,uMoonL,uStar,uWDir,uStarRot,uBow,uBolt,uShip,uNight;
uniform vec3 uObj,uLook;uniform vec2 uLH;uniform sampler2D uOv;
uniform vec3 uSun,uSunL,uSunD,uMoon,uAmb,uPole;
uniform sampler2D uSky,uNrm;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=mat2(1.6,1.2,-1.2,1.6)*p;a*=.5;}return s;}
vec3 lut(vec3 d){float az=clamp(atan(d.x,d.z),-1.6,1.6);float el=asin(clamp(d.y,0.,1.));
 vec2 sz=vec2(64.,32.),tc=vec2(.5+az/3.2,sqrt(el/1.5707963))*sz-.5,i=floor(tc),fr=tc-i;fr=fr*fr*fr*(fr*(fr*6.-15.)+10.);   // гладкая (квинтическая) интерполяция: без видимой сетки
 vec3 c=texture2D(uSky,(i+fr+.5)/sz).rgb+(hash(gl_FragCoord.xy*1.31)-.5)/170.;return c*c*4.;}
vec3 rotAxis(vec3 v,vec3 k,float a){float c=cos(a),s=sin(a);return v*c+cross(k,v)*s+k*dot(k,v)*(1.-c);}
float starField(vec3 rd){
 vec3 q=rotAxis(rd,uPole,uStarRot);vec3 g=q*72.;vec3 id=floor(g);vec3 f=fract(g)-.5;
 float h=hash3(id);vec3 o=vec3(hash3(id+1.7),hash3(id+3.1),hash3(id+5.3))-.5;
 float dd=length(f-o*.7);float px=72.*1.4/uRes.y;
 float b=smoothstep(max(.10,px),0.,dd)*step(.982,h)*(.25+.75*hash3(id+9.1));
 return b*(.75+.25*sin(uTime*3.+h*60.));}
float milky(vec3 rd){vec3 q=rotAxis(rd,uPole,uStarRot);float band=exp(-pow(dot(q,normalize(vec3(.46,.12,.88)))*5.,2.));
 return band*(.35+.65*fbm(q.xz*5.+q.y*3.))*.5;}
vec4 clouds(vec3 rd){
 float m=smoothstep(0.,.07,rd.y);
 vec2 p=rd.xz/(rd.y+.18)*.55+vec2(uTime*.010*(.4+uWind),uTime*.004);
 float d=fbm(p*1.4)*.7+fbm(p*3.5+3.1)*.3;
 float thr=.72-uCloud*.62;
 float a=smoothstep(thr,thr+.17,d)*m;
 float d2=fbm((p+uSun.xz*.07)*1.4);
 float lit=clamp(.62+(fbm(p*1.4)-d2)*5.,0.,1.);
 float thick=clamp((d-thr)*3.,0.,1.);
 vec3 col=uAmb*(.9-.4*thick-.25*uCloud*smoothstep(.2,.9,rd.y))+uSunL*lit*(1.-.65*thick)*.75;
 col*=1.-.55*uRain;
 return vec4(col,a);}
vec3 sky(vec3 rd,bool disk){
 vec3 c=lut(rd);
 float up=step(0.,rd.y);
 if(uStar>.01&&rd.y>0.){c+=vec3(.9,.95,1.)*starField(rd)*uStar*1.6+vec3(.5,.6,.9)*milky(rd)*uStar*.35;}
 // Луна
 if(uMoon.y>-.1){float R=.038;vec3 t1=normalize(cross(vec3(0.,1.,0.),uMoon));vec3 t2=cross(uMoon,t1);
  vec2 l=vec2(dot(rd,t1),dot(rd,t2))/R;float r2=dot(l,l);
  if(dot(rd,uMoon)>0.){
   float a=6.2831853*uMoonPh;
   if(r2<1.){vec3 n=vec3(l.x,l.y,sqrt(1.-r2));float lam=dot(n,vec3(sin(a),0.,-cos(a)));
    float alb=.55+.45*fbm(l*3.+vec2(2.,5.));alb*=.8+.2*fbm(l*11.);
    c+=vec3(1.,.97,.9)*(clamp(lam*3.,0.,1.)*alb+.03)*uMoonL;}
   c+=vec3(.55,.65,.9)*uMoonL*.12*exp(-r2*.18);}}
 vec4 cl=clouds(rd);
 c=mix(c,cl.rgb,cl.a);
 float ci=fbm(vec2(rd.x*2.,rd.z*9.)/(rd.y+.35)+uTime*.01)*smoothstep(.05,.45,rd.y)*(1.-uCloud*.7)*.5;
 c=mix(c,uAmb*1.3+uSunL*.25,clamp((ci-.18)*1.3,0.,.4));
 if(disk){float s=smoothstep(.99989,.99996,dot(rd,uSun));c+=uSunD*s*(1.-cl.a)*(1.-uCloud*.75)*up;}
 // лучи света сквозь облака
 {float sa=dot(rd,uSun);if(sa>.35&&uSun.y>-.04){vec3 t1=normalize(cross(vec3(0.,1.,0.),uSun));vec3 t2=cross(uSun,t1);
   float an=atan(dot(rd,t2),dot(rd,t1));float ray=fbm(vec2(an*6.,uTime*.02))*fbm(vec2(an*13.+4.,uTime*.03));
   float k=pow(max(sa,0.),7.)*smoothstep(.2,.75,uCloud)*(1.-.35*uCloud)*smoothstep(-.04,.2,uSun.y)*(1.-smoothstep(.55,.9,uSun.y));
   c+=uSunL*ray*k*.55*(.4+.6*(1.-cl.a));}}
 // радуга
 if(uBow>.01){float ang=acos(clamp(dot(rd,-uSun),-1.,1.))*57.2958;
  for(int i=0;i<2;i++){float c0=i==0?41.:51.5;float x=(ang-(c0-1.6))/3.2;
   if(x>0.&&x<1.){float hue=(i==0?.76*(1.-x):.76*x);vec3 rb=clamp(abs(mod(hue*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);
    float w=smoothstep(0.,.2,x)*smoothstep(1.,.8,x);c+=rb*w*uBow*(i==0?.9:.35)*(uAmb.g*3.+.05)*(1.-cl.a)*up;}}}
 c+=vec3(.55,.6,.8)*uFlash*(.35+.65*smoothstep(0.,.6,rd.y))*1.2*up;
 // молния
 if(uFlash>.3){float x0=(uBolt-.5)*.9;float yy=rd.y/max(rd.z,.2);float ax=rd.x/max(rd.z,.2);
  float path=x0+(fbm(vec2(yy*22.,uBolt*9.))-.5)*.16+(fbm(vec2(yy*70.,uBolt*5.))-.5)*.04;
  c+=vec3(.7,.75,1.)*smoothstep(.012,0.,abs(ax-path))*step(0.,yy)*(1.-smoothstep(.2,.5,yy))*uFlash*1.8;}
 return c;}
float cr2(vec2 a,vec2 b){return a.x*b.y-a.y*b.x;}
float tri(vec2 p,vec2 a,vec2 b,vec2 c){float s=sign(cr2(b-a,c-a));
 return min(min(s*cr2(b-a,p-a)/length(b-a),s*cr2(c-b,p-b)/length(c-b)),s*cr2(a-c,p-c)/length(a-c));}
float segD(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.));}
vec4 objects(vec3 rd,out vec3 glow){
 float ax=atan(rd.x,rd.z),ay=asin(clamp(rd.y,-1.,1.));float pa=1.3/(uRes.y*1.15);
 vec3 col=vec3(0.);float al=0.;glow=vec3(0.);
 float la=atan(uSun.x,uSun.z);
 vec3 hzc=lut(normalize(vec3(rd.x,.012,max(abs(rd.z),.1))));
 if(uObj.x>.5){float u=ax-uLH.x;
  if(abs(u)<.22&&ay<.16&&ay>-.03){
   float by=-.0025,h=.07,w0=.0072,w1=.0048;
   float ux=abs(u)/.05;float isl=by+.0085*pow(max(1.-ux*ux,0.),1.6)*(.85+.3*noise(vec2(u*160.,2.)));
   float ti=(ay-(by+.007))/h;float tw=mix(w0,w1,clamp(ti,0.,1.));
   float nx=clamp(u/max(tw,1e-4),-1.,1.);float lam=clamp(nx*sin(la-uLH.x)+sqrt(1.-nx*nx)*cos(la-uLH.x)*.7+.15,0.,1.);
   vec3 lit=uAmb*2.2+uSunL*lam*.55;
   float aI=smoothstep(-pa,pa,isl-ay)*smoothstep(-pa,pa,ay+.0018)*step(abs(u),.05);
   col=vec3(.11,.1,.085)*(uAmb*2.4+uSunL*.45*(.3+.7*lam));al=aI;
   float inT=smoothstep(-pa,pa,tw-abs(u))*step(-.02,ti)*step(ti,1.);
   float band=step(.42,ti)*step(ti,.58);
   vec3 tc=mix(vec3(.9,.88,.84),vec3(.75,.12,.1),band)*lit*(.6+.4*(1.-abs(nx)*.5));
   col=mix(col,tc,inT);al=max(al,inT);
   float inG=smoothstep(-pa,pa,.0075-abs(u))*step(.97,ti)*step(ti,1.02);col=mix(col,vec3(.05)*lit,inG);al=max(al,inG);
   float inL=smoothstep(-pa,pa,.0036-abs(u))*step(1.02,ti)*step(ti,1.12);

 gl.uniform1f(U.uMoonPh,P.moonPh);gl.uniform1f(U.uMoonL,P.moonL);gl.uniform1f(U.uStar,P.star);gl.uniform1f(U.uWDir,P.wdir);gl.uniform1f(U.uStarRot,P.starRot);
 gl.uniform1f(U.uBow,P.bow);gl.uniform1f(U.uBolt,S.bolt);gl.uniform1f(U.uNight,P.night2);gl.uniform3fv(U.uObj,P.obj);gl.uniform3f(U.uLook,pit,S.roll*D,0);gl.uniform2f(U.uLH,P.lh,0);
 gl.uniform3fv(U.uSun,P.sun);gl.uniform3fv(U.uSunL,P.sunL);gl.uniform3fv(U.uSunD,P.sunD);gl.uniform3fv(U.uMoon,P.moon);gl.uniform3fv(U.uAmb,P.amb);gl.uniform3fv(U.uPole,P.pole);
 gl.drawArrays(gl.TRIANGLES,0,3);
 // проход 2: на экран в родном разрешении — бикубика, резкость, дизеринг, капли на стекле
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);gl.useProgram(P2);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,fbTex);
 gl.uniform1i(U2.uScene,1);gl.uniform2f(U2.uRes,cv.width,cv.height);gl.uniform2f(U2.uSceneRes,sw,sh);gl.uniform1f(U2.uTime,now/1000);gl.uniform1f(U2.uRain,S.rain);gl.uniform1f(U2.uFog,S.fog);gl.uniform1f(U2.uDrops,S.drops?1:0);gl.drawArrays(gl.TRIANGLES,0,3);
 // качество: один раз подбираем разрешение сцены под устройство, дальше только вниз и редко
 ema=ema*.93+dt*.07;fr++;
 if(fr>45&&fr%120===0&&(bench<3||fr%900===0)){const budget=1000/cap;if(ema>budget*1.22&&qs>.42){qs=Math.max(.4,qs-.07);scene();bench++;ema=budget}else if(bench<3)bench=9}
 if(showFps&&fr%20===0)$('fps').textContent=(1000/ema).toFixed(0)+' к/с · сцена '+sw+'×'+sh+' · экран '+cv.width+'×'+cv.height}

function sunTimes(){let up=null,dn=null;for(let h=.05;h<=24;h+=.05){const e=solar(h,S.lat,S.doy).el,pv=solar(h-.05,S.lat,S.doy).el;if(pv<0&&e>=0&&up===null)up=h;if(pv>=0&&e<0)dn=h}return{up:up??6,dn:dn??20}}
const WP={'Штиль':[.03,.12,0,0,0],'Бриз':[.22,.3,0,0,0],'Ясно':[.3,.05,0,0,0],'Облачно':[.35,.55,0,0,0],'Пасмурно':[.45,.95,0,.1,0],'Дождь':[.6,.95,.65,.25,0],'Шторм':[1,1,.9,.3,1],'Туман':[.08,.7,0,.85,0]};
function manual(){if(S.auto){S.auto=false;clearInterval(AT);$('auto').classList.remove('on');try{localStorage.removeItem('seaAuto')}catch(e){}$('src').textContent=''}}
function setW(a){manual();[S.wind,S.cloud,S.rain,S.fog,S.storm]=a;sync();dirty=true}
function sync(){['wind','cloud','rain','fog'].forEach(k=>$(k).value=S[k]);$('t').value=S.t;$('tl').textContent=hh(S.t);$('cam').value=S.cam;$('real').checked=S.real;$('fast').checked=S.fast}
const bowB=document.createElement('button');bowB.className='ch';bowB.textContent='Радуга';
bowB.onclick=()=>{manual();const st=sunTimes(),sp=solar(st.dn-2.2,S.lat,S.doy);S.real=false;S.fast=false;S.t=st.dn-2.2;setW([.3,.5,.2,0,0]);S.cam=((sp.az/D+180)+180)%360;S.windDir=S.cam+160;S.yawD=0;sync();dirty=true};$('pw').appendChild(bowB);
Object.keys(WP).forEach(k=>{const b=document.createElement('button');b.className='ch';b.textContent=k;b.onclick=()=>setW(WP[k]);$('pw').appendChild(b)});
[['Рассвет',()=>sunTimes().up+.3],['Полдень',()=>12],['Закат',()=>sunTimes().dn-.4],['Сумерки',()=>sunTimes().dn+.8],['Ночь',()=>23.5]].forEach(a=>{const b=document.createElement('button');b.className='ch';b.textContent=a[0];b.onclick=()=>{manual();S.real=false;S.fast=false;S.t=(a[1]()+24)%24;sync();dirty=true};$('pt').appendChild(b)});
['wind','cloud','rain','fog'].forEach(k=>$(k).oninput=e=>{manual();S[k]=+e.target.value;S.storm=S.rain>.8&&S.wind>.8?1:0;dirty=true});
$('t').oninput=e=>{manual();S.t=+e.target.value;S.real=false;S.fast=false;$('tl').textContent=hh(S.t);$('real').checked=false;$('fast').checked=false;dirty=true};
$('cam').oninput=e=>{S.windDir=S.windDir-S.cam+(+e.target.value);S.cam=+e.target.value;dirty=true};
$('real').onchange=e=>{S.real=e.target.checked;if(S.real)S.fast=false;sync();dirty=true};
$('fast').onchange=e=>{manual();S.fast=e.target.checked;if(S.fast)S.real=false;sync()};
$('qual').onchange=e=>{const v=e.target.value;cap=v==='eco'?20:30;qs=v==='max'?1:v==='eco'?.5:(/Mobi|Android/i.test(navigator.userAgent)?.6:.85);bench=v==='auto'?0:9;ema=1000/cap;scene()};
['lhOn','shipOn','birdsOn','drops'].forEach(k=>$(k).onchange=e=>{S[k]=e.target.checked?1:0;dirty=true});
$('tg').onclick=()=>$('ui').classList.toggle('on');
$('tg').addEventListener('dblclick',()=>{showFps=!showFps;$('fps').style.display=showFps?'block':'none'});
// корабль по запросу: появляется слева в кадре и проходит вдоль горизонта
function spawnShip(near,fast){const side=Math.random()<.5?-1:1;let x0,z0,xt,zt;
 if(near){x0=-170;z0=300;xt=40;zt=110}else{x0=side*(300+Math.random()*150);z0=420+Math.random()*220;xt=-side*(20+Math.random()*60);zt=110+Math.random()*90}
 SHIP=newShip(x0,z0,Math.atan2(xt-x0,zt-z0),fast)}
$('callship').onclick=()=>{S.shipOn=1;$('shipOn').checked=true;spawnShip(true,$('fastShip').checked);$('st').textContent='Парусник выходит слева и идёт к вам, обходя справа. Настоящая скорость около 5 узлов.'};
// погода и время: Open-Meteo (открытые данные национальных метеослужб), время — по часам устройства в часовом поясе места
async function weather(){try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),9000);
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${S.lat}&longitude=${S.lon}&current=weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,precipitation&timezone=auto&forecast_days=1`,{signal:ac.signal});clearTimeout(tm);
  const j=await r.json(),c=j.current,w=c.weather_code;S.off=j.utc_offset_seconds;S.wind=clamp(Math.pow(c.wind_speed_10m/55,.8),0,1);S.cloud=c.cloud_cover/100;
  S.rain=clamp((w>=51&&w<=67||w>=80&&w<=82)?.3+c.precipitation/3:c.precipitation>0?c.precipitation/4:0,0,1);S.fog=(w===45||w===48)?.8:0;S.storm=w>=95?1:0;if(S.storm)S.rain=Math.max(S.rain,.85);
  S.windDir=(c.wind_direction_10m+180)%360;S.real=true;S.fast=false;sync();dirty=true;
  $('src').textContent=`Авто · Open-Meteo · ${S.lat.toFixed(2)}°, ${S.lon.toFixed(2)}° · ${c.wind_speed_10m} км/ч, облачность ${c.cloud_cover}% · обновлено ${hh(hoursNow())}`}
 catch(e){$('src').textContent='Нет связи с сервисом погоды. Показываю последние данные, время по часам.'}}
function locate(){return new Promise(res=>{if(!navigator.geolocation){res(false);return}navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;res(true)},()=>res(false),{timeout:8000,maximumAge:6e5})})}
async function autoOn(){S.auto=true;$('auto').classList.add('on');S.real=true;S.fast=false;sync();try{localStorage.setItem('seaAuto','1')}catch(e){}
 $('src').textContent='Авто: определяю место…';const ok=await locate();if(!ok)$('src').textContent='Место не определено, использую последнее известное. Можно ввести город.';
 await weather();clearInterval(AT);AT=setInterval(weather,6e5)}
$('auto').onclick=()=>{if(S.auto)manual();else autoOn()};
$('go').onclick=async()=>{const n=$('city').value.trim();if(!n)return;try{const r=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(n)}&count=1&language=ru`)).json();
 if(!r.results){$('src').textContent='Город не найден';return}S.lat=r.results[0].latitude;S.lon=r.results[0].longitude;S.auto=true;$('auto').classList.add('on');await weather();clearInterval(AT);AT=setInterval(weather,6e5)}catch(e){$('src').textContent='Нет связи'}};
$('city').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
// положение телефона: гироскоп поворачивает вид, наклон вверх/вниз двигает горизонт, крен наклоняет его
let head0=null;
function onOri(e){if(!S.gyro||e.alpha==null)return;const a=e.alpha*D,b=e.beta*D,g=e.gamma*D;
 const E=-Math.sin(g)*Math.cos(a)-Math.cos(g)*Math.sin(b)*Math.sin(a),N=-Math.sin(g)*Math.sin(a)+Math.cos(g)*Math.sin(b)*Math.cos(a),Up=-Math.cos(g)*Math.cos(b);
 const hd=Math.atan2(E,N)/D;if(head0===null)head0=hd;const tg=wrap(hd-head0);S.yawG+=wrap(tg-S.yawG)*.18;
 S.pitG+=(clamp(Math.asin(clamp(Up,-1,1))/D,-35,35)-S.pitG)*.18;S.roll+=((Math.abs(b)>.7?-g/D:0)-S.roll)*.18}
async function gyroOn(){try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){$('st').textContent='Доступ к датчикам не разрешён';return}}}catch(e){}
 S.gyro=true;head0=null;S.yawG=0;$('gyro').classList.add('on');$('st').textContent='Гироскоп: поворачивайте телефон, чтобы осматриваться';tilt.tx=tilt.ty=0}
function gyroOff(){S.gyro=false;S.yawG=S.pitG=S.roll=0;$('gyro').classList.remove('on')}
$('gyro').onclick=()=>S.gyro?gyroOff():gyroOn();
addEventListener('deviceorientationabsolute',onOri);addEventListener('deviceorientation',e=>{if(!window._abs)onOri(e);if(e.gamma!=null&&!S.gyro){tilt.tx=clamp(e.gamma/35,-1,1);tilt.ty=clamp((e.beta-50)/35,-1,1);window._g=1}});
addEventListener('deviceorientationabsolute',()=>{window._abs=1});
// перетаскивание пальцем или мышью: осмотреться
let drag=null;cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture&&cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){S.yawD-=(e.clientX-drag.x)*.22;S.pitD=clamp(S.pitD+(e.clientY-drag.y)*.12,-30,30);drag={x:e.clientX,y:e.clientY}}else if(!window._g&&!S.gyro){tilt.tx=(e.clientX/innerWidth-.5)*1.4;tilt.ty=(e.clientY/innerHeight-.5)*1.4}});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>drag=null));
cv.addEventListener('dblclick',()=>{S.yawD=0;S.pitD=0});
addEventListener('resize',size);
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;ready=false});
cv.addEventListener('webglcontextrestored',()=>{lost=false;initGL()});
if(/Mobi|Android/i.test(navigator.userAgent))qs=.6;
S.t=hoursNow();sync();size();if(initGL()){requestAnimationFrame(frame);try{if(localStorage.getItem('seaAuto')==='1')autoOn()}catch(e){}}
</script></body></html>
